<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  html, body { margin: 0; }
  body { width: 1080px; height: 1080px; display: grid; place-items: center; background: linear-gradient(135deg, #12a06f, #0a6446); font-family: "Pretendard Variable", sans-serif; overflow: hidden; position: relative; }
  .blob { position: absolute; right: -160px; top: -160px; width: 620px; height: 620px; border-radius: 50%; background: rgba(255,255,255,.12); }
  .mark { width: 640px; height: 640px; border-radius: 170px; background: #fff; display: grid; place-items: center; box-shadow: 0 30px 80px rgba(0,0,0,.18); position: relative; }
  .mark b { font-size: 400px; margin-top: -20px; font-weight: 800; color: #0f8a5f; letter-spacing: -0.04em; line-height: 1; }
  .mark i { position: absolute; bottom: 92px; font-style: normal; font-size: 64px; font-weight: 800; color: #1c211d; letter-spacing: -0.02em; }
</style>
</head>
<body>
  <div class="blob"></div>
  <div class="mark"><b>연</b></div>
</body>
</html>
