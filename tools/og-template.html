<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; font-family: "Pretendard Variable", sans-serif; background: linear-gradient(135deg, #12a06f, #0a6446); color: #fff; position: relative; word-break: keep-all; }
  .blob { position: absolute; right: -80px; top: -120px; width: 520px; height: 520px; border-radius: 50%; background: rgba(255,255,255,.12); }
  .brand { position: absolute; left: 80px; top: 64px; display: flex; align-items: center; gap: 14px; font-weight: 800; font-size: 34px; }
  .mark { width: 52px; height: 52px; border-radius: 14px; background: #fff; color: #0f8a5f; display: grid; place-items: center; font-size: 28px; }
  h1 { position: absolute; left: 80px; top: 150px; margin: 0; font-size: 76px; line-height: 1.18; letter-spacing: -0.03em; font-weight: 800; }
  h1 em { font-style: normal; color: #d9ffe9; }
  .sub { position: absolute; left: 80px; top: 350px; font-size: 30px; font-weight: 600; color: rgba(255,255,255,.88); }
  .cal { position: absolute; right: 80px; top: 170px; background: #fff; border-radius: 28px; padding: 24px 26px; color: #1c211d; box-shadow: 0 20px 50px rgba(0,0,0,.18); }
  .cal h2 { margin: 0 0 12px; font-size: 22px; }
  .grid { display: grid; grid-template-columns: repeat(7, 44px); gap: 6px; }
  .d { height: 44px; border-radius: 10px; display: grid; place-items: center; font-weight: 700; font-size: 18px; }
  .h { color: #d93a3a; } .s { color: #2f6fd1; }
  .b { background: #eaf7f0; } .l { background: #0f8a5f; color: #fff; }
  .foot { position: absolute; left: 80px; bottom: 60px; font-size: 26px; font-weight: 700; color: rgba(255,255,255,.9); }
  .pill { display: inline-block; background: rgba(255,255,255,.18); padding: 8px 18px; border-radius: 999px; margin-right: 10px; }
</style>
</head>
<body>
  <div class="blob"></div>
  <div class="brand"><span class="mark">연</span>연차각</div>
  <h1>연차 3일로<br><em>9일</em> 쉬는 법</h1>
  <div class="sub">남은 연차로 제일 길게 쉬는 조합을 찾아드려요</div>
  <div class="cal">
    <h2>2026년 10월</h2>
    <div class="grid">
      <span class="d h">일</span><span class="d">월</span><span class="d">화</span><span class="d">수</span><span class="d">목</span><span class="d">금</span><span class="d s">토</span>
      <span class="d h">27</span><span class="d">28</span><span class="d">29</span><span class="d">30</span><span class="d">1</span><span class="d">2</span><span class="d h b">3</span>
      <span class="d h b">4</span><span class="d h b">5</span><span class="d l">6</span><span class="d l">7</span><span class="d l">8</span><span class="d h b">9</span><span class="d s b">10</span>
      <span class="d h b">11</span><span class="d">12</span><span class="d">13</span><span class="d">14</span><span class="d">15</span><span class="d">16</span><span class="d s">17</span>
    </div>
  </div>
  <div class="foot"><span class="pill">2026 남은 연차</span><span class="pill">2027 황금연휴</span><span class="pill">5인 미만</span></div>
</body>
</html>
