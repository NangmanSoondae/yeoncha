<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  html, body { margin: 0; }
  body { width: 1080px; height: 1350px; overflow: hidden; font-family: "Pretendard Variable", sans-serif; background: linear-gradient(160deg, #12a06f, #0a6446); color: #fff; position: relative; word-break: keep-all; }
  .blob { position: absolute; right: -140px; top: -140px; width: 560px; height: 560px; border-radius: 50%; background: rgba(255,255,255,.12); }
  .top { position: absolute; left: 80px; top: 88px; font-size: 34px; font-weight: 700; color: rgba(255,255,255,.85); }
  h1 { position: absolute; left: 80px; top: 150px; margin: 0; font-size: 88px; line-height: 1.16; letter-spacing: -0.03em; font-weight: 800; }
  h1 em { font-style: normal; color: #d9ffe9; }
  .panel { position: absolute; left: 60px; right: 60px; top: 430px; background: #fff; border-radius: 36px; padding: 40px 44px; color: #1c211d; }
  .panel h2 { margin: 0 0 18px; font-size: 34px; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
  .d { height: 76px; border-radius: 16px; display: grid; place-items: center; font-weight: 800; font-size: 30px; position: relative; }
  .w { font-size: 24px; height: 40px; color: #5d665f; }
  .h { color: #d93a3a; } .s { color: #2f6fd1; }
  .b { background: #eaf7f0; } .l { background: #0f8a5f; color: #fff; }
  .d small { position: absolute; bottom: 6px; font-size: 15px; font-weight: 700; color: #d93a3a; }
  .l small { color: #d9ffe9; }
  .opts { list-style: none; margin: 26px 0 0; padding: 0; display: grid; gap: 14px; }
  .opts li { display: flex; justify-content: space-between; align-items: baseline; font-size: 32px; font-weight: 700; border-top: 2px solid #e6ebe7; padding-top: 14px; }
  .opts li b { color: #0f8a5f; font-size: 38px; }
  .opts li span.m { font-size: 26px; color: #5d665f; font-weight: 600; margin-left: 10px; }
  .foot { position: absolute; left: 80px; bottom: 80px; }
  .foot b { display: block; font-size: 40px; font-weight: 800; }
  .foot span { font-size: 30px; color: rgba(255,255,255,.85); font-weight: 600; }
</style>
</head>
<body>
  <div class="blob"></div>
  <div class="top">연차각 · 2026 연말</div>
  <h1>연차 4일이면<br><em>10일</em> 쉰다</h1>
  <div class="panel">
    <h2>2026년 12월 → 2027년 1월</h2>
    <div class="grid">
      <span class="d w h">일</span><span class="d w">월</span><span class="d w">화</span><span class="d w">수</span><span class="d w">목</span><span class="d w">금</span><span class="d w s">토</span>
      <span class="d h">20</span><span class="d">21</span><span class="d">22</span><span class="d">23</span><span class="d">24</span><span class="d h b">25<small>성탄절</small></span><span class="d s b">26</span>
      <span class="d h b">27</span><span class="d l">28<small>연차</small></span><span class="d l">29<small>연차</small></span><span class="d l">30<small>연차</small></span><span class="d l">31<small>연차</small></span><span class="d h b">1<small>신정</small></span><span class="d s b">2</span>
      <span class="d h b">3</span><span class="d">4</span><span class="d">5</span><span class="d">6</span><span class="d">7</span><span class="d">8</span><span class="d s">9</span>
    </div>
    <ul class="opts">
      <li><span>연차 4일 <span class="m">12/28~31</span></span><b>12/25~1/3 · 10일</b></li>
      <li><span>연차 1일 <span class="m">12/24</span></span><b>12/24~27 · 4일</b></li>
      <li><span>연차 1일 <span class="m">12/31</span></span><b>12/31~1/3 · 4일</b></li>
    </ul>
  </div>
  <div class="foot"><b>내 남은 연차로 계산해 보기 →</b><span>yeoncha.nangsoon.com</span></div>
</body>
</html>
